services:
  postgres:
    image: postgres:17-alpine
    container_name: injurysub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: injurysub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - injurysub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d injurysub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  injurysub-postgres-data:
