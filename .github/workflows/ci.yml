name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # GNU timeout turns a hung step into an ordinary failure (exit 124) instead of a cancelled run.
      - name: Install dependencies
        run: timeout --kill-after=1m 10m pnpm install --frozen-lockfile
      - name: Run check gate
        run: timeout --kill-after=1m 15m pnpm check
